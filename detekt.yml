build:
  maxIssues: 0

complexity:
  LongMethod:
    threshold: 80
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 8
  TooManyFunctions:
    thresholdInFiles: 25
    thresholdInClasses: 20
  CyclomaticComplexMethod:
    threshold: 20

style:
  MagicNumber:
    active: false
  MaxLineLength:
    maxLineLength: 160
  UnusedPrivateMember:
    active: true
  ReturnCount:
    max: 4
  ForbiddenComment:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Za-z0-9]*'

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
